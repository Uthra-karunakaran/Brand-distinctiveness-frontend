<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Locify">
  <!-- Locify mark: the ring is the category everyone sits inside, the solid
       dot is the brand that sits apart from it. Same geometry as the in-app
       wordmark in src/App.jsx; keep the two in sync.
       (No double hyphens in here: XML comments forbid them and the whole
       file silently fails to parse as an image.) -->
  <defs>
    <linearGradient id="locify-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d97f2"/>
      <stop offset="1" stop-color="#1e63c2"/>
    </linearGradient>
    <mask id="locify-cut">
      <rect width="32" height="32" fill="#fff"/>
      <circle cx="22.4" cy="9.6" r="5.9" fill="#000"/>
    </mask>
  </defs>

  <rect width="32" height="32" rx="7.5" fill="url(#locify-bg)"/>
  <g mask="url(#locify-cut)">
    <circle cx="16" cy="16" r="9" fill="none" stroke="#fff" stroke-opacity=".52" stroke-width="2.4"/>
    <circle cx="16" cy="16" r="2.5" fill="#fff" fill-opacity=".38"/>
  </g>
  <circle cx="22.4" cy="9.6" r="4.1" fill="#fff"/>
</svg>
